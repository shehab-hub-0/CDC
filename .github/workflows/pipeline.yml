name: Advanced Data Pipeline CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  static-analysis:
    name: 🛡️ Security & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit black isort

      - name: 📝 Check Code Formatting (Black/Isort)
        run: |
          black --check .
          isort --check-only .

      - name: 🔍 Static Security Analysis (Bandit)
        run: |
          bandit -r . -x ./.venv,./tests

      - name: 📏 Lint with Flake8
        run: |
          flake8 . --count --max-line-length=127 --statistics

  unit-tests:
    name: 🧪 Automated Testing
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pytest faker psycopg2-binary python-dotenv
      
      - name: 🚀 Run Pytest
        run: |
          pytest tests/

  container-security:
    name: 🐳 Docker Analysis & Build
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: 🕵️ Dockerfile Linter (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.jupyter

      - name: 🏗️ Build Docker Image
        run: |
          docker build -t cdc-jupyter -f Dockerfile.jupyter .

      - name: 🛠️ Validate Docker Compose Config
        run: |
          docker compose config
