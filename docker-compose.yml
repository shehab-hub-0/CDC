services:
  # --- Infrastructure: Conduktor Persistence ---
  postgresql-conduktor:
    image: postgres:14
    hostname: postgresql-conduktor
    container_name: postgresql-conduktor
    volumes:
      - pg_conduktor_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: "conduktor-console"
      POSTGRES_USER: "conduktor"
      POSTGRES_PASSWORD: "conduktor_password"
      POSTGRES_HOST_AUTH_METHOD: "trust"
    networks:
      - data-stream-network

  # --- Infrastructure: Kafka (KRaft Mode) ---
  kafka1:
    image: confluentinc/cp-kafka:8.0.0
    hostname: kafka1
    container_name: kafka1
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:9099"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:9099
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:19092,EXTERNAL://localhost:9092,DOCKER://host.docker.internal:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - data-stream-network

  # --- Infrastructure: Conduktor Console ---
  conduktor-console:
    image: conduktor/conduktor-console:1.36.2
    container_name: conduktor-console
    ports:
      - "8082:8080"
    depends_on:
      postgresql-conduktor:
        condition: service_started
      kafka1:
        condition: service_healthy
    volumes:
      - conduktor_data:/var/conduktor
    environment:
      CDK_DATABASE_URL: "postgresql://conduktor:conduktor_password@postgresql-conduktor:5432/conduktor-console"
      CDK_CLUSTERS_0_ID: "default"
      CDK_CLUSTERS_0_NAME: "My Local Kafka Cluster"
      CDK_CLUSTERS_0_COLOR: "#0013E7"
      CDK_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka1:19092"
    networks:
      - data-stream-network

  # --- Data Source: PostgreSQL (Financial DB) ---
  postgres:
    image: postgres:latest
    container_name: postgres
    hostname: postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: [ 'postgres', '-c', 'wal_level=logical' ]
    healthcheck:
      test: [ 'CMD', 'psql', '-U', 'postgres', '-c', 'SELECT 1' ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data-stream-network

  # --- CDC: Debezium Connector ---
  debezium:
    image: quay.io/debezium/connect:2.4
    container_name: debezium
    hostname: debezium
    depends_on:
      postgres:
        condition: service_healthy
      kafka1:
        condition: service_healthy
    ports:
      - '8083:8083'
    environment:
      BOOTSTRAP_SERVERS: kafka1:19092
      CONNECT_REST_ADVERTISED_HOST_NAME: debezium
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      STATUS_STORAGE_TOPIC: connect_statuses
      OFFSET_STORAGE_TOPIC: connect_offsets
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    networks:
      - data-stream-network

  # --- CDC: Debezium UI ---
  debezium-ui:
    image: quay.io/debezium/debezium-ui:2.4
    container_name: debezium-ui
    hostname: debezium-ui
    depends_on:
      debezium:
        condition: service_started
    ports:
      - '8084:8080'
    environment:
      KAFKA_CONNECT_URIS: http://debezium:8083
    networks:
      - data-stream-network

  # --- Data Warehouse: ClickHouse ---
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    hostname: clickhouse
    ports:
      - '8123:8123'
      - '9000:9000'
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DB}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    volumes:
      - ./config/clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "localhost:8123/ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data-stream-network

  # --- Processing: Spark (Master & Worker) ---
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    environment:
      - SPARK_HOME=/opt/spark
      - SPARK_MASTER_MEMORY=1G
      - SPARK_LOCAL_IP=127.0.0.1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - '8080:8080'
      - '7077:7077'
    networks:
      - data-stream-network

  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark-worker
    ports:
      - "8081:8081"
    environment:
      - SPARK_HOME=/opt/spark
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_LOCAL_IP=127.0.0.1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    networks:
      - data-stream-network

  # --- BI: Apache Superset ---
  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile.superset
    container_name: superset
    ports:
      - "8089:8088"
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY}
      - SUPERSET_CONFIG_PATH=/app/superset_config.py
      - SUPERSET_DB_URI=${SUPERSET_DB_URI}
    env_file:
      - .env
    volumes:
      - ./superset/superset_config.py:/app/superset_config.py
      - ./superset/import_wizard.py:/app/import_wizard.py
      - ./superset/SUPERSET_DASHBOARD_PRO.yaml:/app/SUPERSET_DASHBOARD_PRO.yaml
      - ./superset/SUPERSET_DASHBOARD_PRO.zip:/app/SUPERSET_DASHBOARD_PRO.zip
      - superset_home:/app/superset_home
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data-stream-network

  # --- Development: Jupyter with Spark ---
  jupyter-spark:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    container_name: jupyter-spark
    ports:
      - "8888:8888"
      - "4040:4040"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_LOCAL_IP=127.0.0.1
    volumes:
      - .:/workspace
    depends_on:
      - spark-master
    networks:
      - data-stream-network

networks:
  data-stream-network:
    name: data-stream-network
    driver: bridge

volumes:
  pg_conduktor_data: {}
  conduktor_data: {}
  superset_home: {}
